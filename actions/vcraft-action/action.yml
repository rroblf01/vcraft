name: vcraft-action
description: Build a Python extension written in V with vcraft
branding:
  icon: package
  color: blue

inputs:
  vcraft-version:
    description: The vcraft release to download, e.g. v0.1.0.
    required: false
    default: v0.1.0
  args:
    description: The vcraft command to run, e.g. "build --release".
    required: false
    default: build --release
  container:
    description: >
      An image to run the build inside, e.g. a manylinux image. When set,
      nothing is installed on the runner: the image already carries the
      toolchain, the interpreters, V and vcraft.
    required: false
    default: ''
  working-directory:
    description: The project directory to run vcraft in.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: refuse Windows explicitly
      # Nothing below works there: the V release has no Windows binary in this
      # shape, `ln -sf` has nowhere to land, and vcraft quotes its compiler
      # arguments for a POSIX shell. Failing here names the limitation instead
      # of failing ten steps later inside a C compiler error.
      if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        echo "error: vcraft-action does not support Windows runners yet" >&2
        exit 1

    - name: install the V compiler
      if: ${{ inputs.container == '' }}
      shell: bash
      # Built from source at a pinned commit, because no V release is newer
      # than the flags vcraft passes: the 0.5.2 release predates `-new-compiler`
      # and fails every build with "Unknown argument". Same pins as docker/* and
      # .github/workflows/ci.yml; when a newer V release exists this goes back
      # to downloading it.
      env:
        V_COMMIT: 0137eb5d8ebc5d183259309ed08ea06ba9bc27d6
        VC_COMMIT: 8af812feb76c678abd86a8e682fd9ab2790e519c
      run: |
        git init -q /tmp/v-src
        cd /tmp/v-src
        git remote add origin https://github.com/vlang/v.git
        git fetch -q --depth 1 origin "$V_COMMIT"
        git checkout -q FETCH_HEAD
        git clone https://github.com/vlang/vc.git vc
        (cd vc && git checkout -q "$VC_COMMIT")
        make fresh_tcc
        make local=1 "-j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
        echo "/tmp/v-src" >> "$GITHUB_PATH"

    - name: install vcraft
      if: ${{ inputs.container == '' }}
      shell: bash
      run: |
        # From PyPI rather than the GitHub release: the tarballs no longer exist,
        # and the wheel carries the same binary plus the V modules it was built
        # with. The leading v comes off the version because tags read
        # `vcraft/v0.1.0` and PyPI reads `0.1.0`.
        VERSION="${{ inputs.vcraft-version }}"
        python3 -m pip install "vcraft==${VERSION#v}"

    - name: run vcraft
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -n "${{ inputs.container }}" ]; then
          # The project goes in at /work, which is also where vcraft writes `dist/`,
          # so the upload step finds the wheels where it always has.
          docker run --rm -v "$PWD:/work" -w /work \
            "${{ inputs.container }}" vcraft ${{ inputs.args }}
        else
          # Split on purpose: `${{ inputs.args }}` is words the caller chose, and
          # quoting it would hand vcraft one argument containing spaces rather
          # than several.
          # shellcheck disable=SC2086
          vcraft ${{ inputs.args }}
        fi
