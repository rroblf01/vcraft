name: Bug report
description: Something vcraft does wrong -- a build, a conversion, a crash, a wrong result.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fastest fix comes from a small V file and the command that
        shows the problem. For a security issue, use SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest V source and Python snippet that show it, and the commands you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full error or traceback (with `vcraft build` add `--debug` for V line numbers).
      render: text
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Paste the output of `vcraft doctor` and `vcraft version --full`.
      render: text
    validations:
      required: true
