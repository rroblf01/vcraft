name: release

# One trigger for the whole release: push a single tag `v1.6.0` and the images,
# the wheels, the PyPI upload, the GitHub release and the action's floating tags
# all follow in order. The old namespaces (`images/v*`, `vcraft/v*`,
# `vcraft-action/v*`) are no longer used.
on:
  push:
    tags:
      - v*

# Serialise releases per ref, but never cancel one. Publishing to PyPI is not
# safely interruptible: a run cancelled between uploading some wheels and others
# leaves a partial release, and a release cannot be un-published. So a second
# run for the same tag queues behind the first instead of replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  V_COMMIT: 36be92642c49a8fe9213ea4b96c6bf56b67b668c
  VC_COMMIT: 6851aaf3f9e696b30b26e406f16095b0002acaab

# ---------------------------------------------------------------------------
# 1. Images: build and push the manylinux/musllinux images (x86_64 + aarch64)
#    that CI and the wheel build depend on. The buildcache-* tags pushed here
#    are what the `build` job's manylinux rebuild reads back.
# ---------------------------------------------------------------------------
jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: manylinux
            dockerfile: docker/manylinux.Dockerfile
            base: quay.io/pypa/manylinux_2_28_x86_64
            runner: ubuntu-latest
            arch: x86_64
            python: /opt/python/cp314-cp314/bin/python
          - image: manylinux
            dockerfile: docker/manylinux.Dockerfile
            base: quay.io/pypa/manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            python: /opt/python/cp314-cp314/bin/python
          - image: musllinux
            dockerfile: docker/musllinux.Dockerfile
            runner: ubuntu-latest
            arch: x86_64
            python: /usr/bin/python3
          - image: musllinux
            dockerfile: docker/musllinux.Dockerfile
            runner: ubuntu-24.04-arm
            arch: aarch64
            python: /usr/bin/python3
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: check the tag names the version being built
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAMPED="$(grep -o "pub const version = '[^']*'" vlib/vcraft_project/env.v | cut -d"'" -f2)"
          test "$VERSION" = "$STAMPED" || {
            echo "error: tag says $VERSION but the tree stamps $STAMPED" >&2
            exit 1
          }

      - name: smoke-test the image definition
        env:
          BASE: ${{ matrix.base }}
        run: |
          docker build --check ${BASE:+--build-arg "BASE=$BASE"} \
            -f ${{ matrix.dockerfile }} .

      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: build the architecture image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BASE=${{ matrix.base }}
            VCRAFT_REF=${{ github.sha }}
          load: true
          tags: vcraft-${{ matrix.image }}:verify
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/vcraft-${{ matrix.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/vcraft-${{ matrix.image }}:buildcache-${{ matrix.arch }},mode=max

      - name: verify the image builds a wheel that imports
        run: |
          IMAGE=vcraft-${{ matrix.image }}:verify
          PY=${{ matrix.python }}
          mkdir -p "$RUNNER_TEMP/verify"
          docker run --rm -v "$RUNNER_TEMP/verify:/work" -w /work "$IMAGE" vcraft new verify
          docker run --rm -v "$RUNNER_TEMP/verify/verify:/work" -w /work "$IMAGE" sh -c "
            set -e
            vcraft build --target linux-${{ matrix.arch }}-${{ matrix.image == 'musllinux' && 'musl' || 'gnu' }} --interpreter $PY
            $PY -m venv /tmp/check
            /tmp/check/bin/python -m pip install -q dist/*.whl
            /tmp/check/bin/python -c 'import verify_native as m; assert m.add(2, 3) == 5; print(m.greet(\"image\"))'
          "

      - name: push the architecture tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="ghcr.io/${{ github.repository_owner }}/vcraft-${{ matrix.image }}:${VERSION}-${{ matrix.arch }}"
          docker tag vcraft-${{ matrix.image }}:verify "$TARGET"
          docker push "$TARGET"

  images-merge:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up buildx
        uses: docker/setup-buildx-action@v4

      - name: merge the per-architecture tags into one manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for IMAGE in manylinux musllinux; do
            for TAG in "$VERSION" latest; do
              docker buildx imagetools create \
                -t "ghcr.io/${{ github.repository_owner }}/vcraft-${IMAGE}:${TAG}" \
                "ghcr.io/${{ github.repository_owner }}/vcraft-${IMAGE}:${VERSION}-x86_64" \
                "ghcr.io/${{ github.repository_owner }}/vcraft-${IMAGE}:${VERSION}-aarch64"
            done
          done

# ---------------------------------------------------------------------------
# 2. Build: run the suites on three platforms and produce the vcraft binaries.
#    Needs the images (manylinux rebuild + buildcache).
# ---------------------------------------------------------------------------
  build:
    needs: [images-merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-26
            asset: macos-arm64
          - os: windows-latest
            asset: win-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: download the prebuilt compiler
        id: v-prebuilt
        if: runner.os != 'Windows'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v-src
          gh release download "v/$V_COMMIT" \
            --pattern "v-$V_COMMIT-${{ matrix.asset }}.tar.gz" \
            --dir /tmp/v-dl --clobber
          tar -xzf "/tmp/v-dl/v-$V_COMMIT-${{ matrix.asset }}.tar.gz" -C /tmp/v-src
          /tmp/v-src/v version

      - name: download the prebuilt compiler (Windows)
        id: v-prebuilt-win
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "$env:RUNNER_TEMP\v-src"
          gh release download "v/$env:V_COMMIT" --pattern "v-$env:V_COMMIT-win-amd64.tar.gz" --dir "$env:RUNNER_TEMP\v-dl" --clobber
          New-Item -ItemType Directory -Force $v | Out-Null
          tar -xzf "$env:RUNNER_TEMP\v-dl\v-$env:V_COMMIT-win-amd64.tar.gz" -C $v
          & "$v\v.exe" version

      - name: restore the V compiler cache
        if: runner.os != 'Windows' && steps.v-prebuilt.outcome != 'success'
        id: v-cache
        uses: actions/cache@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: restore the V compiler cache (Windows)
        if: runner.os == 'Windows'
        id: v-cache-win
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: build the V compiler from source
        if: runner.os != 'Windows' && steps.v-prebuilt.outcome != 'success' && steps.v-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/v-src
          git init -q /tmp/v-src
          cd /tmp/v-src
          git remote add origin https://github.com/vlang/v.git
          git fetch -q --depth 1 origin "$V_COMMIT"
          git checkout -q FETCH_HEAD
          git clone https://github.com/vlang/vc.git vc
          (cd vc && git checkout -q "$VC_COMMIT")
          make fresh_tcc
          make local=1 "-j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"

      - name: build the V compiler (Windows)
        if: runner.os == 'Windows' && steps.v-prebuilt-win.outcome != 'success' && steps.v-cache-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = "$env:RUNNER_TEMP\v-src"
          git init -q $v
          git -C $v remote add origin https://github.com/vlang/v.git
          git -C $v fetch -q --depth 1 origin $env:V_COMMIT
          git -C $v checkout -q FETCH_HEAD
          git clone -q https://github.com/vlang/vc.git "$v\vc"
          git -C "$v\vc" checkout -q $env:VC_COMMIT
          git clone --filter=blob:none -q --branch thirdparty-windows-amd64 https://github.com/vlang/tccbin "$v\thirdparty\tcc"
          & "$v\makev.bat" --local
          & "$v\v.exe" version

      - name: save the V compiler (Windows)
        if: runner.os == 'Windows' && steps.v-cache-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

      - name: put V on PATH
        if: runner.os != 'Windows'
        run: echo "/tmp/v-src" >> "$GITHUB_PATH"

      - name: put V on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:RUNNER_TEMP\v-src" >> $env:GITHUB_PATH

      - name: run the test suites
        if: runner.os != 'Windows'
        run: |
          python3 tests/codegen/test_codegen.py
          python3 tests/runtime/test_runtime.py
          python3 tests/wheel/test_wheel.py
          python3 tests/project/check_toml.py
          python3 tests/packaging/test_pack.py
          python3 tests/cli/test_cli.py

      - name: run the test suites (Windows)
        if: runner.os == 'Windows'
        run: |
          python tests/project/check_toml.py
          python tests/runtime/test_runtime.py
          python tests/codegen/test_codegen.py
          python tests/memory/test_leaks.py
          python tests/fuzz/test_fuzz.py 4 20000

      - name: build the shipped vcraft
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          VCRAFT_CC: ${{ runner.os == 'macOS' && 'clang' || '' }}
        run: |
          ./scripts/build-vcraft.sh
          if [ "$RUNNER_OS" = "Windows" ]; then bin/vcraft.exe version; else bin/vcraft version; fi

      - name: make the macOS binary self-contained
        if: runner.os == 'macOS'
        run: |
          dep="$(otool -L bin/vcraft | awk '/libgc\.dylib/{print $1; exit}')"
          if [ -z "$dep" ]; then
            echo "no dynamic libgc dependency; the binary is already self-contained"
            exit 0
          fi
          lib="$(find /tmp/v-src/thirdparty -name libgc.dylib -print -quit)"
          test -n "$lib" || { echo "libgc.dylib not found under /tmp/v-src/thirdparty"; exit 1; }
          cp "$lib" bin/libgc.dylib
          install_name_tool -change "$dep" @loader_path/libgc.dylib bin/vcraft
          otool -l bin/vcraft \
            | awk '/LC_RPATH/{c=3} c>0{print; c--}' | grep 'path ' | awk '{print $2}' \
            | while read -r rp; do
                case "$rp" in
                  /tmp/*|/private/tmp/*|/Users/*) install_name_tool -delete_rpath "$rp" bin/vcraft ;;
                esac
              done
          codesign --force --sign - bin/vcraft
          echo "== dependencies =="; otool -L bin/vcraft
          echo "== rpaths =="; otool -l bin/vcraft | awk '/LC_RPATH/{c=3} c>0{print; c--}' || true
          test -f bin/libgc.dylib
          otool -L bin/vcraft | grep -q '@loader_path/libgc.dylib'
          if otool -l bin/vcraft | awk '/LC_RPATH/{c=3} c>0{print; c--}' | grep -qE ' /(private/)?tmp/| /Users/'; then
            echo "an absolute rpath is still in the binary"; exit 1
          fi

      - name: set up buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4

      - name: log in to ghcr.io
        if: runner.os == 'Linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: rebuild the Linux binary in the manylinux image
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/manylinux.Dockerfile
          build-args: |
            BASE=quay.io/pypa/manylinux_2_28_x86_64
            VCRAFT_REF=${{ github.sha }}
          load: true
          tags: vcraft-release
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/vcraft-manylinux:buildcache-x86_64

      - name: take the binary out of the image
        if: runner.os == 'Linux'
        run: |
          id="$(docker create vcraft-release)"
          docker cp "$id:/src/vcraft/bin/vcraft" bin/vcraft
          docker rm "$id"
          bin/vcraft version

      - name: upload the distribution
        uses: actions/upload-artifact@v6
        with:
          name: vcraft-dist-${{ matrix.asset }}
          path: |
            bin/vcraft*
            bin/*.dylib
            vlib/

# ---------------------------------------------------------------------------
# 3. Publish: assemble the platform wheels, upload to PyPI, and create the
#    GitHub release. Needs the build artifacts.
# ---------------------------------------------------------------------------
  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: download the distributions
        uses: actions/download-artifact@v7
        with:
          path: dists
          pattern: vcraft-dist-*

      - name: check the tag names the version being built
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAMPED="$(grep -o "pub const version = '[^']*'" vlib/vcraft_project/env.v | cut -d"'" -f2)"
          test "$VERSION" = "$STAMPED" || {
            echo "error: tag says $VERSION but the tree stamps $STAMPED" >&2
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: assemble the platform wheels
        run: |
          mkdir -p dist
          python3 scripts/pack-vcraft-wheel.py --version "$VERSION" \
            --platform manylinux_2_28_x86_64 \
            --bin dists/vcraft-dist-linux-x86_64/bin/vcraft \
            --vlib dists/vcraft-dist-linux-x86_64/vlib \
            --out-dir dist
          python3 scripts/pack-vcraft-wheel.py --version "$VERSION" \
            --platform macosx_11_0_arm64 \
            --bin dists/vcraft-dist-macos-arm64/bin/vcraft \
            --vlib dists/vcraft-dist-macos-arm64/vlib \
            --out-dir dist
          python3 scripts/pack-vcraft-wheel.py --version "$VERSION" \
            --platform win_amd64 \
            --bin dists/vcraft-dist-win-amd64/bin/vcraft.exe \
            --vlib dists/vcraft-dist-win-amd64/vlib \
            --out-dir dist
          ls dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verify-metadata: true

      - name: publish the GitHub release notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

# ---------------------------------------------------------------------------
# 4. Action: validate the composite action and move its floating tags so that
#    @v1 / @v1.x follow the release. Needs publish to have succeeded.
# ---------------------------------------------------------------------------
  action:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: install PyYAML
        run: python -m pip install -q pyyaml

      - name: validate the action definition
        run: python -c "import yaml,sys; d=yaml.safe_load(open('actions/vcraft-action/action.yml')); assert d['runs']['using']=='composite', d; print('action ok:', d['name'])"

      - name: move the floating tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          git tag -fa "$MAJOR" -m "vcraft-action $MAJOR"
          git tag -fa "$MINOR" -m "vcraft-action $MINOR"
          git push origin "$MAJOR" "$MINOR" --force
