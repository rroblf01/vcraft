name: release-v

# Publishes the prebuilt V compiler this repository pins, so CI and releases can
# download it instead of building it from source on every runner. One archive per
# runner platform, attached to a release tagged `v/<commit>`: a download takes
# seconds where the source build takes five to seven minutes.
#
# The release is a prerelease, so it is a toolchain cache and never the repository's
# "latest release": that stays the real vcraft release under the `vcraft/v*` tag.
#
# Runs only when a release asks for it, or on demand: never on a push. release.yml calls
# it first, and it builds only what is missing from the release (see the `check` job), so
# a release whose pin has not moved costs one API call. A user's `vcraft toolchain
# install` downloads these archives, which is what keeps a first install to seconds
# instead of a five-minute compiler build; ci.yml and release.yml also use them and fall
# back to a source build when one is missing, so CI after a pin move only costs time
# until the next release (or a manual run) publishes the new archives.
on:
  workflow_dispatch:
  # release.yml calls this first, so a release never reaches its first-install check
  # with archives that still predate the -prod rebuild.
  workflow_call:

permissions:
  contents: write

# The same pins as ci.yml, docker/* and the vcraft-action.
env:
  V_COMMIT: 36be92642c49a8fe9213ea4b96c6bf56b67b668c
  VC_COMMIT: 6851aaf3f9e696b30b26e406f16095b0002acaab

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.release.outputs.missing }}
    steps:
      - name: which archives the release lacks
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have="$(gh release view "v/$V_COMMIT" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=false
          for asset in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 win-amd64; do
            echo "$have" | grep -qx "v-$V_COMMIT-$asset.tar.gz" || { echo "missing: $asset"; missing=true; }
          done
          # Archives published before the -prod rebuild only ran at their build path;
          # the marker says this release's archives are the relocatable kind.
          # The second marker: archives that also carry `.git/HEAD` and were checked by
          # rebuilding in place and compiling `import os` away from their build path.
          echo "$have" | grep -qx "v-$V_COMMIT-relocatable2.txt" || { echo "missing: relocatable archives"; missing=true; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then missing=true; fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  build:
    needs: [check]
    if: needs.check.outputs.missing == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One archive per platform a user's `vcraft toolchain install` may run on.
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
          - os: macos-26
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: windows-latest
            asset: win-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: build the V compiler from source
        if: runner.os != 'Windows'
        run: |
          git init -q "$RUNNER_TEMP/v-src"
          cd "$RUNNER_TEMP/v-src"
          git remote add origin https://github.com/vlang/v.git
          git fetch -q --depth 1 origin "$V_COMMIT"
          git checkout -q FETCH_HEAD
          git clone https://github.com/vlang/vc.git vc
          (cd vc && git checkout -q "$VC_COMMIT")
          make fresh_tcc
          make local=1 "-j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          # Rebuilt with -prod before it is shipped. A development build keeps only the
          # *path* of every `$embed_file` (the C headers V's backend embeds) and reads it
          # at run time, so a compiler built here panicked on every other machine --
          # where /tmp/v-src does not exist -- and every user fell back to building V.
          ./v -prod -o v.prod cmd/v
          mv v.prod v
          ./v version

      # Native Windows: `makev.bat`, not `make`, with the bundled TCC it wants. The
      # tccbin clone is what `makev.bat --local` expects to find already in place.
      - name: build the V compiler from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "$env:RUNNER_TEMP\v-src"
          git init -q $v
          git -C $v remote add origin https://github.com/vlang/v.git
          git -C $v fetch -q --depth 1 origin $env:V_COMMIT
          git -C $v checkout -q FETCH_HEAD
          git clone -q https://github.com/vlang/vc.git "$v\vc"
          git -C "$v\vc" checkout -q $env:VC_COMMIT
          git clone --filter=blob:none -q --branch thirdparty-windows-amd64 https://github.com/vlang/tccbin "$v\thirdparty\tcc"
          & "$v\makev.bat" --local
          # -prod, so the files V embeds are inside the binary (see the POSIX step).
          & "$v\v.exe" -prod -o "$v\v.prod.exe" "$v\cmd\v"
          Move-Item -Force "$v\v.prod.exe" "$v\v.exe"
          & "$v\v.exe" version

      - name: package it
        # The compiler finds `vlib` and `thirdparty` beside its own binary, so the
        # archive is the whole checkout minus the two directories a build only needs
        # once: the bootstrap C sources and the git history. The bundled TCC stays in
        # on Windows: it is what V links with there. Git Bash provides `tar` on the
        # Windows runner, so one body packages every platform. The archive is named
        # relative to the working directory: GNU tar reads `D:\a\...` as `host:path`, a
        # remote archive, and fails on Windows with "Cannot connect to D".
        shell: bash
        run: |
          cd "$RUNNER_TEMP/v-src"
          rm -rf vc .git
          # The commit, where `v version` reads it: the compiler a consumer rebuilds
          # in place (see the next step) reports it only through `.git/HEAD`.
          mkdir .git
          echo "$V_COMMIT" > .git/HEAD
          tar -czf "../v-$V_COMMIT-${{ matrix.asset }}.tar.gz" .
          ls -l "$RUNNER_TEMP/v-$V_COMMIT-${{ matrix.asset }}.tar.gz"

      # The archive is unpacked somewhere else and run there, the way a user's `vcraft
      # toolchain install` runs it, so a compiler that only works at its build path
      # fails here instead of in every user's first install.
      - name: the archive works away from its build path
        shell: bash
        run: |
          elsewhere="$RUNNER_TEMP/relocated"
          mkdir -p "$elsewhere"
          # A relative archive name, for the reason given when it was packaged.
          (cd "$RUNNER_TEMP" && tar -xzf "v-$V_COMMIT-${{ matrix.asset }}.tar.gz" -C relocated)
          mv "$RUNNER_TEMP/v-src" "$RUNNER_TEMP/v-src.moved"
          v="$elsewhere/v"; exe=""; [ -x "$v" ] || { v="$elsewhere/v.exe"; exe=".exe"; }
          # V resolves its standard library from the root baked in at build time, which
          # no longer exists here, so every consumer rebuilds it in place first, as
          # `vcraft toolchain install` does (rebuild_in_place in toolchain.v).
          (cd "$elsewhere" && "$v" -o "v.self$exe" cmd/v && mv -f "v.self$exe" "v$exe")
          "$v" version | tee "$RUNNER_TEMP/version.txt"
          grep -q "${V_COMMIT:0:7}" "$RUNNER_TEMP/version.txt"
          # Something that imports beyond builtin, compiled from outside the V root:
          # a program with no imports passed here while `import os` failed everywhere.
          mkdir -p "$RUNNER_TEMP/probe"
          printf 'import os\nfn main() { println("relocated ok " + os.base("a/b")) }\n' > "$RUNNER_TEMP/probe/hello.v"
          (cd "$RUNNER_TEMP/probe" && "$v" run hello.v) | tee "$RUNNER_TEMP/run.txt"
          grep -q "relocated ok b" "$RUNNER_TEMP/run.txt"

      - name: upload the archive
        uses: actions/upload-artifact@v6
        with:
          name: v-${{ matrix.asset }}
          path: ${{ runner.temp }}/v-${{ env.V_COMMIT }}-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: download the archives
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: v-*

      - name: mark the archives relocatable
        run: |
          mkdir -p relocatable
          echo "carry .git/HEAD; rebuilt in place and compiled import os away from their build path" > "relocatable/v-$V_COMMIT-relocatable2.txt"

      - name: create or update the release
        # One publish step rather than one per matrix cell: several cells racing to
        # create the same release is how a tag ends up with only some of its assets.
        #
        # A prerelease on purpose. This is a toolchain cache for the workflows, not a
        # release of vcraft: marking it prerelease keeps it out of the "latest release"
        # slot, so the repository's Releases page still points at the real vcraft
        # version. The vcraft releases are the `vcraft/v*` tags, a different namespace.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v/${{ env.V_COMMIT }}
          name: V toolchain ${{ env.V_COMMIT }}
          prerelease: true
          body: |
            The V compiler vcraft pins for this commit, built from source on each
            runner platform. `ci.yml` and `release.yml` download these instead
            of building V, and fall back to a source build when one is missing.

            This is a workflow toolchain cache, not a vcraft release.
          files: |
            assets/**/*.tar.gz
            relocatable/*.txt
          fail_on_unmatched_files: true
