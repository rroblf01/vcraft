name: docs

# The documentation site: build on a change to the docs, deploy from main. Built with
# MkDocs Material and localized with mkdocs-static-i18n (English at `/`, Spanish at
# `/es/`).
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: install MkDocs and the i18n plugin
        run: pip install -r docs/requirements.txt

      - name: build the site
        run: mkdocs build

      - name: set up Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # A pull request only builds, so a broken page is caught before it lands.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
