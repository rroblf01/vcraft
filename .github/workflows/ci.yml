name: ci

# Documentation changes do not touch anything the suites build, so they do not
# start a run. A workflow_dispatch still runs everything on demand.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A new push to a pull request makes the run for the previous one moot, so it is
# cancelled rather than queued behind. Pushes to main are never cancelled: each
# commit there keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The platforms no developer machine in this project can cover. Linux x86_64 is
# verified locally in containers; macOS runs here, on a hosted runner, with the
# same suites. Windows and aarch64 Linux are covered by the generated build
# matrix and the published images instead: the test scripts are bash and the
# toolchain expectations are POSIX, so running them there would test the port
# rather than the product.

# V comes from source at a pinned commit, not from a release: no V release is
# newer than the flags vcraft passes, so a release binary fails every build.
# Same pins as docker/*, the vcraft-action and release-vcraft.yml.
env:
  V_COMMIT: 36be92642c49a8fe9213ea4b96c6bf56b67b668c
  VC_COMMIT: 6851aaf3f9e696b30b26e406f16095b0002acaab

jobs:
  # The V compiler, once per runner OS, before anything else starts. Without
  # this job every cell restored-or-built it on its own: when the cache key
  # changed, all twenty cells missed at once and each spent five to six minutes
  # building the same compiler. Saved explicitly, so the cache is written even
  # when a later suite fails, and as soon as the build is done.
  v-compiler:
    name: V compiler (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: look for a cached compiler
        id: v-cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}
          lookup-only: true

      - name: build the V compiler from source
        if: steps.v-cache.outputs.cache-hit != 'true'
        run: |
          git init -q /tmp/v-src
          cd /tmp/v-src
          git remote add origin https://github.com/vlang/v.git
          git fetch -q --depth 1 origin "$V_COMMIT"
          git checkout -q FETCH_HEAD
          git clone https://github.com/vlang/vc.git vc
          (cd vc && git checkout -q "$VC_COMMIT")
          make fresh_tcc
          make local=1 "-j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          # The bootstrap C sources are only read while building the compiler
          # itself. Dropping them keeps the cached directory at ~170 MB instead
          # of ~2 GB, which is what every job restores on a cache hit.
          rm -rf vc

      - name: save the compiler
        if: steps.v-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}

  # The suites run in two jobs rather than one so the slowest (cli, with its
  # dozen extension builds) does not hold the other five behind it. The suites
  # are independent -- only the cli one needs bin/vcraft, and it builds it
  # itself -- so nothing is shared between the two jobs.
  suites:
    needs: v-compiler
    # Every supported CPython on both platforms: a wheel is built per interpreter,
    # and the runtime compiles against each version's headers, so a version left
    # out of this list is a version nobody has compiled for. Keep it in step with
    # `supported_pythons` in vlib/vcraft_project/build.v.
    name: suites (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # macOS runs the oldest and newest supported CPython only. Hosted macOS
        # runners are scarce, and with every version the cells queued for minutes
        # before starting; what breaks on macOS so far has been the platform
        # (linking, deployment target, compiler choice), not one Python version.
        # Linux keeps every version.
        # aarch64 Linux, like macOS, runs the oldest and newest supported CPython.
        exclude:
          - os: macos-26
            python: "3.12"
          - os: macos-26
            python: "3.13"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.13"
        # The next CPython, while it is a prerelease: a heads-up that does not fail
        # the run. It moves into the list above, and into `supported_pythons`, once
        # it is released.
        include:
          - os: ubuntu-latest
            python: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # Built once per runner OS by the v-compiler job, which every job here
      # waits for, so this only ever restores it.
      - name: restore the V compiler
        uses: actions/cache/restore@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}
          fail-on-cache-miss: true

      - name: put V on PATH
        id: v-ready
        run: echo "/tmp/v-src" >> "$GITHUB_PATH"

      # One step per suite, so the summary names the one that failed. Each
      # suite builds what it needs, so a failure in one does not stop the rest;
      # only a missing compiler does.
      - name: "suite: vcraft.toml parser"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/project/check_toml.py

      - name: "suite: tool wheel packer"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/packaging/test_pack.py

      - name: "suite: wheel writer"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/wheel/test_wheel.py

      - name: "suite: runtime"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/runtime/test_runtime.py

      - name: "suite: code generator"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/codegen/test_codegen.py

      - name: "suite: leaks"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/memory/test_leaks.py

      - name: "suite: fuzzed conversions"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/fuzz/test_fuzz.py 4 20000

      - name: "suite: README examples"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/docs/test_readme.py

  cli:
    needs: v-compiler
    # The slowest suite on its own job (see above for why it is separate).
    # Same matrix: the CLI builds against each interpreter's headers.
    name: cli (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # macOS runs the oldest and newest supported CPython only. Hosted macOS
        # runners are scarce, and with every version the cells queued for minutes
        # before starting; what breaks on macOS so far has been the platform
        # (linking, deployment target, compiler choice), not one Python version.
        # Linux keeps every version.
        # aarch64 Linux, like macOS, runs the oldest and newest supported CPython.
        exclude:
          - os: macos-26
            python: "3.12"
          - os: macos-26
            python: "3.13"
          - os: ubuntu-24.04-arm
            python: "3.12"
          - os: ubuntu-24.04-arm
            python: "3.13"
        # The next CPython, while it is a prerelease: a heads-up that does not fail
        # the run. It moves into the list above, and into `supported_pythons`, once
        # it is released.
        include:
          - os: ubuntu-latest
            python: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # Built once per runner OS by the v-compiler job, which every job here
      # waits for, so this only ever restores it.
      - name: restore the V compiler
        uses: actions/cache/restore@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}
          fail-on-cache-miss: true

      - name: put V on PATH
        id: v-ready
        run: echo "/tmp/v-src" >> "$GITHUB_PATH"

      # The CLI suite checks this repository's workflows and the action with
      # PyYAML, and skips those checks without it: that is how a renamed job once
      # broke them with nothing in CI noticing.
      - name: install PyYAML for the workflow checks
        run: python3 -m pip install -q pyyaml

      - name: "suite: cli"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: python3 tests/cli/test_cli.py

  musl:
    # The suites on musl libc, inside the published musllinux image, which carries V
    # at the pinned commit, gcc and CPython. Run with `docker run` from the runner
    # rather than as a job container: GitHub's JavaScript actions (checkout, cache)
    # cannot run inside Alpine. Bump MUSL_IMAGE when the images are re-released.
    name: musl (alpine, x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      MUSL_IMAGE: ghcr.io/rroblf01/vcraft-musllinux:1.0.0
    steps:
      - uses: actions/checkout@v5

      - name: log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: run the suites on musl
        run: |
          # As the runner's user, so nothing in the checkout ends up owned by root,
          # with a writable HOME for V's module cache and pip.
          docker run --rm --memory 6g --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -w /work "$MUSL_IMAGE" sh -c '
            set -e
            python3 -VV
            for suite in project/check_toml wheel/test_wheel runtime/test_runtime \
                         codegen/test_codegen memory/test_leaks fuzz/test_fuzz cli/test_cli; do
              echo "== $suite"
              python3 tests/$suite.py
            done
          '

  sanitizers:
    # The runtime, the example's glue and the conversions under AddressSanitizer and
    # UndefinedBehaviorSanitizer: an out-of-bounds read, a use-after-free or an
    # overflow in C or in the generated V aborts the suite here instead of corrupting
    # a user's process. Linux only, where gcc ships both runtimes.
    name: sanitizers (ubuntu-latest, 3.14)
    needs: v-compiler
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: restore the V compiler
        uses: actions/cache/restore@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}
          fail-on-cache-miss: true

      - name: put V on PATH
        id: v-ready
        run: echo "/tmp/v-src" >> "$GITHUB_PATH"

      - name: "sanitized: runtime"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: scripts/run-sanitized.sh python3 tests/runtime/test_runtime.py

      - name: "sanitized: code generator"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: scripts/run-sanitized.sh python3 tests/codegen/test_codegen.py

      - name: "sanitized: fuzzed conversions"
        if: ${{ !cancelled() && steps.v-ready.outcome == 'success' }}
        run: scripts/run-sanitized.sh python3 tests/fuzz/test_fuzz.py 4 10000

  free-threaded:
    needs: v-compiler
    # The one configuration nothing else exercises: a free-threaded interpreter
    # with the GIL actually disabled. A build that merely tags `cp314t` but
    # crashes, warns, or serialises on import fails here rather than on a
    # user's machine.
    name: free-threaded (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        python: ["3.13t", "3.14t"]
        # One free-threaded cell on macOS, for the same reason as above.
        exclude:
          - os: macos-26
            python: "3.13t"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: set up a free-threaded Python
        id: ft-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Built once per runner OS by the v-compiler job, which every job here
      # waits for, so this only ever restores it.
      - name: restore the V compiler
        uses: actions/cache/restore@v5
        with:
          path: /tmp/v-src
          key: v-slim1-${{ matrix.os }}-${{ runner.arch }}-${{ env.V_COMMIT }}-${{ env.VC_COMMIT }}
          fail-on-cache-miss: true

      - name: put V on PATH
        id: v-ready
        run: echo "/tmp/v-src" >> "$GITHUB_PATH"

      - name: build the vcraft binary
        run: ./scripts/build-vcraft.sh && bin/vcraft version

      - name: build a free-threaded wheel
        run: |
          ./bin/vcraft new ftcheck /tmp/ftcheck
          cd /tmp/ftcheck
          "$GITHUB_WORKSPACE/bin/vcraft" build --free-threading \
            --interpreter "${{ steps.ft-python.outputs.python-path }}" \
            --out-dir dist

      - name: import it with the GIL disabled
        # `PYTHON_GIL=0` is the whole test, and `-W error::RuntimeWarning` makes
        # the assertion exact: without the `Py_mod_gil` declaration the
        # interpreter re-enables the GIL with a warning instead, which becomes
        # an error here. Threads prove the `@[vc_gil]` release is paired on
        # every path rather than merely present.
        working-directory: /tmp/ftcheck
        run: |
          PYTHON_GIL=0 "${{ steps.ft-python.outputs.python-path }}" -W error::RuntimeWarning -c "
          import sys, threading, glob
          sys.path.insert(0, glob.glob('dist/build/*.so')[0].rsplit('/', 1)[0])
          import ftcheck_native as m
          assert not sys._is_gil_enabled(), 'importing the module re-enabled the GIL'
          assert m.add(2, 3) == 5
          # Enough calls to trigger many collections while all eight threads
          # run in parallel: a thread the collector does not know aborts the
          # process here, and a dozen calls never reached a collection at all.
          seen = []
          def burn():
              for _ in range(20_000):
                  seen.append(m.greet('threads'))
          threads = [threading.Thread(target=burn) for _ in range(8)]
          [t.start() for t in threads]
          [t.join() for t in threads]
          assert len(seen) == 160_000, len(seen)
          print('free-threaded import and threads ok')
          "
