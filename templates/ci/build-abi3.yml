# Generated by vcraft 1.8.0 for mypkg.
# Regenerate with `vcraft generate-ci`. Do not edit by hand: the matrix is
# derived from what this version of vcraft supports, and a hand-edited matrix
# stops matching the tag logic in the binary.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "cp311-abi3-manylinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.8.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-x86_64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
            check: "/opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-manylinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-manylinux:1.8.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-aarch64-gnu --manylinux 2_28 --interpreter /opt/python/cp311-cp311/bin/python"
            check: "/opt/python/cp311-cp311/bin/python"
          - target: "cp311-abi3-musllinux-x86_64"
            os: "ubuntu-latest"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.8.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-x86_64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
            check: "/usr/bin/python3"
          - target: "cp311-abi3-musllinux-aarch64"
            os: "ubuntu-24.04-arm"
            container: "ghcr.io/rroblf01/vcraft-musllinux:1.8.0"
            abi3: "3.11"
            args: "build --release --abi3 3.11 --target linux-aarch64-musl --musllinux 1_2 --interpreter /usr/bin/python3"
            check: "/usr/bin/python3"
          - target: "cp311-abi3-macosx-arm64"
            os: "macos-26"
            python: "3.11"
            abi3: "3.11"
            args: "build --release --abi3 3.11"
          - target: "cp311-abi3-win_amd64"
            os: "windows-latest"
            python: "3.11"
            abi3: "3.11"
            args: "build --release --abi3 3.11"

    steps:
      - uses: actions/checkout@v5

      - name: set up Python
        id: python
        if: ${{ matrix.container == '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: build
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          container: ${{ matrix.container }}
          args: ${{ matrix.args }}${{ matrix.free-threading && matrix.container == '' && format(' --interpreter {0}', steps.python.outputs.python-path) || '' }}

      - name: the wheel was written
        shell: bash
        run: |
          ls -la dist || true
          ls dist/*.whl >/dev/null 2>&1 || { echo 'no wheel was written in dist/'; exit 1; }

      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*.whl

      - name: test (POSIX)
        if: ${{ runner.os != 'Windows' }}
        env:
          CONTAINER: ${{ matrix.container }}
          CHECK: ${{ matrix.check || steps.python.outputs.python-path }}
        run: |
          script="$CHECK -m venv /tmp/check && /tmp/check/bin/python -m pip install dist/*.whl && /tmp/check/bin/python -c 'import mypkg_native; print(mypkg_native.__name__)'"
          if [ -n "$CONTAINER" ]; then
            docker run --rm -e CHECK -v "$PWD:/work" -w /work "$CONTAINER" sh -c "$script"
          else
            sh -c "$script"
          fi
      - name: test (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          CHECK: ${{ steps.python.outputs.python-path }}
        run: |
          & "$env:CHECK" -m venv "$env:RUNNER_TEMP\check"
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -m pip install (Get-ChildItem dist/*.whl).FullName
          & "$env:RUNNER_TEMP\check\Scripts\python.exe" -c "import mypkg_native; print(mypkg_native.__name__)"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: source distribution
        uses: rroblf01/vcraft/actions/vcraft-action@v1
        with:
          args: sdist

      - name: upload
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build, sdist]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: download the wheels and the sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: sign the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # Trusted publishing: PyPI checks the OIDC identity of the job; no secret is stored.
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
          attestations: true
